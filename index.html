<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav></nav>

    <main>
        <section class="hero-section">

            <nav class="mainhero-nav">
                <img class="netflixLogo-img" src="media/images/logo.svg" alt="Netflix">
                <a class="heroSigninButton-a">
                    <span id="signin-span">Sign in</span>
                </a>
            </nav>

            <div class="HeroContent-div">

                <h1>Unlimited movies, TV <br> shows, and more</h1>
                <p>Plans start Rs 250. Cancel anytime.</p>
                <h3>Ready to watch? Enter your email to start your membership.</h3>

            </div>

        </section>
    </main>
</body>

</html>
